# Alembic CLI 설정 (M4-02). DB URL 은 AIOPS_DATABASE_URL(.env) 에서 읽는다.
#   새 마이그레이션: alembic revision --autogenerate -m "설명"
#   적용:           alembic upgrade head      (앱은 AIOPS_DB_SCHEMA_MODE=migrate 면 기동 시 자동 적용)
[alembic]
script_location = src/aiops/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
