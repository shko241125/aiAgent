# 로컬 개발 스택: API + PostgreSQL + Qdrant (+ 선택: Ollama 구축형 LLM)
#   docker compose up -d                       # 기본
#   docker compose --profile local-llm up -d   # Ollama 포함
#   docker compose --profile observability up -d  # Prometheus + Loki (AIOPS_OPS_SOURCE=live 검증용)
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      AIOPS_DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      AIOPS_VECTOR_BACKEND: qdrant
      AIOPS_QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # GPU 사용 시:
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:  # API 스크레이프 + SLO burn-rate 규칙 (M4-03)
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/aiops-slo-rules.yml:/etc/prometheus/aiops-slo-rules.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports: ["3000:3000"]
    volumes:  # SLO 대시보드 자동 적재
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/aiops-slo-dashboard.json:/var/lib/grafana/dashboards/aiops-slo-dashboard.json:ro

  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    ports: ["3100:3100"]

volumes:
  pgdata:
  qdrant:
  ollama:
