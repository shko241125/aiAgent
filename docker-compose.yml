# 로컬 개발 스택: API + PostgreSQL + Qdrant (+ 선택: Ollama 구축형 LLM)
#   docker compose up -d                       # 기본
#   docker compose --profile local-llm up -d   # Ollama 포함
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      AIOPS_DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      AIOPS_VECTOR_BACKEND: qdrant
      AIOPS_QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # GPU 사용 시:
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

volumes:
  pgdata:
  qdrant:
  ollama:
