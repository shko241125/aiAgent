name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv venv .venv -p 3.11 && uv pip install -p .venv -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests scripts && .venv/bin/ruff format --check src tests scripts
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Evals (scripted — prompt/agent plumbing regression)
        run: |
          .venv/bin/python scripts/run_evals.py
          .venv/bin/python scripts/eval_rca.py
          .venv/bin/python scripts/eval_remediation.py
          .venv/bin/python scripts/eval_retrieval.py
          .venv/bin/python scripts/eval_anomaly.py
          .venv/bin/python scripts/eval_situation.py
          .venv/bin/python scripts/eval_prediction.py
      - name: Docs ↔ Kanban board in sync
        run: .venv/bin/python -m aiops.kanban.cli docs check
