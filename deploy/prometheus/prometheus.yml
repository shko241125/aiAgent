# docker compose --profile observability 용 Prometheus 설정 (M4-03)
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/aiops-slo-rules.yml  # scripts/gen_observability.py 생성물

scrape_configs:
  - job_name: aiops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
